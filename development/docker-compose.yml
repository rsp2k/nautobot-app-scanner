# Dev stack for nautobot-app-scanner.
#
# 4 containers: postgres + redis + nautobot-web + nautobot-worker, plus a
# one-shot init container that fixes named-volume ownership.
#
# COMPOSE_PROJECT_NAME (set in .env) provides the project namespace — Docker
# Compose picks it up automatically; no `name:` directive needed.
#
# Reverse-proxied via caddy-docker-proxy on the external `caddy` network.
# Plugin source bind-mounted from ../src for hot-reload (restart web to apply).

x-nautobot-common: &nautobot-common
  build:
    context: ..
    dockerfile: development/Dockerfile
  image: nautobot-app-scanner-dev:latest
  restart: unless-stopped
  # LocalBackend dispatches nmap as a synchronous subprocess in whatever
  # container the call originates (`web` for shell-driven dispatch,
  # `worker` for Job-driven). Raw-socket scan modes (-sS / -sI / -O / -f /
  # --mtu) need NET_RAW + NET_ADMIN plus file caps on /usr/bin/nmap and
  # Docker's `no_new_privs` disabled (it blocks file caps on non-root
  # exec by default). Granted on the common anchor so either container
  # can drive a pentest-class scan without retripping over this.
  cap_add:
    - NET_RAW
    - NET_ADMIN
  security_opt:
    - no-new-privileges:false
  environment:
    NAUTOBOT_ALLOWED_HOSTS: "${DOMAIN} nautobot-web localhost 127.0.0.1"
    # Use the fully-qualified container name (not the short service alias)
    # because nautobot-web is on the shared caddy network where foreign
    # containers can shadow generic names like `postgres`/`redis`. The
    # unique service names below (scanner-postgres/scanner-redis) make
    # cross-stack collision impossible.
    NAUTOBOT_DB_HOST: scanner-postgres
    NAUTOBOT_DB_PORT: "5432"
    NAUTOBOT_DB_NAME: ${NAUTOBOT_DB_NAME}
    NAUTOBOT_DB_USER: ${NAUTOBOT_DB_USER}
    NAUTOBOT_DB_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
    NAUTOBOT_REDIS_HOST: scanner-redis
    NAUTOBOT_REDIS_PORT: "6379"
    NAUTOBOT_REDIS_PASSWORD: ${NAUTOBOT_REDIS_PASSWORD}
    NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
    NAUTOBOT_SUPERUSER_NAME: ${NAUTOBOT_SUPERUSER_NAME}
    NAUTOBOT_SUPERUSER_EMAIL: ${NAUTOBOT_SUPERUSER_EMAIL}
    NAUTOBOT_SUPERUSER_PASSWORD: ${NAUTOBOT_SUPERUSER_PASSWORD}
    NAUTOBOT_SUPERUSER_API_TOKEN: ${NAUTOBOT_SUPERUSER_API_TOKEN}
    NAUTOBOT_CREATE_SUPERUSER: "true"
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./nautobot_config/nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
    - ../src:/opt/plugin/src
    - nautobot-static:/opt/nautobot/static
    - nautobot-media:/opt/nautobot/media
    - nautobot-git-repos:/opt/nautobot/git
  depends_on:
    scanner-postgres:
      condition: service_healthy
    scanner-redis:
      condition: service_healthy
    nautobot-init:
      condition: service_completed_successfully

services:
  # One-shot: chown named volumes to UID 999 (nautobot) before app containers
  # start. Docker creates volume roots as root:root; the non-root nautobot
  # user can't write to them otherwise. Idempotent.
  nautobot-init:
    image: nautobot-app-scanner-dev:latest
    build:
      context: ..
      dockerfile: development/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-init
    user: "0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /opt/nautobot/media /opt/nautobot/static /opt/nautobot/git && echo 'volumes chowned'"]
    volumes:
      - nautobot-static:/opt/nautobot/static
      - nautobot-media:/opt/nautobot/media
      - nautobot-git-repos:/opt/nautobot/git
    networks:
      - internal

  scanner-postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NAUTOBOT_DB_NAME}
      POSTGRES_USER: ${NAUTOBOT_DB_USER}
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  scanner-redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${NAUTOBOT_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NAUTOBOT_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nautobot-web:
    <<: *nautobot-common
    container_name: ${COMPOSE_PROJECT_NAME}-web
    # Loopback-only port mapping for direct curl/Playwright access.
    # Caddy reverse-proxies normal browser traffic via the labels below.
    # 8086 was taken by another project at scaffold time; 8087 is the next free.
    ports:
      - "127.0.0.1:8087:8080"
    healthcheck:
      # Use the in-process /health/ endpoint (cheap) instead of the upstream
      # `nautobot-server health_check` (which cold-boots Django every probe).
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8080/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    networks:
      - internal
      - caddy
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: "gzip zstd"
      # Use the local rfc2136 TSIG path for ACME DNS-01 challenges.
      # The snippet (defined in the global Caddyfile) points at
      # dell01:5353 directly via TSIG and uses public resolvers for
      # propagation checks — bypasses the dell01:53 connection-refused
      # path that breaks the default DNS-01 flow for *.l.warehack.ing
      # hostnames. Same pattern as blender-mcp-prod and friends.
      caddy.tls.import: rfc2136_local

  nautobot-worker:
    <<: *nautobot-common
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    # `command:` (not `entrypoint:`) so upstream docker-entrypoint.sh runs
    # first — it sets up media/static perms before exec'ing the worker.
    command: ["nautobot-server", "celery", "worker", "-l", "INFO"]
    healthcheck:
      test: ["CMD-SHELL", "nautobot-server health_check"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 5m
    networks:
      - internal

  # Reference scanner agent on HOST networking — has L2 visibility to
  # whatever LAN the docker host is on. Use this agent for any scan
  # that needs MAC discovery (ARP works, unlike inside the bridge-
  # networked worker), or that needs to reach 192.168.x.y / on-prem
  # ranges directly. Polls the Nautobot REST API for assigned scans,
  # runs the right probe tool locally, POSTs results back.
  #
  # Requires AGENT_ID + AGENT_TOKEN in .env (set after creating the
  # ScannerAgent record in Nautobot's UI). Until those are set, this
  # service will log "unauthorized" and back off — leave it commented
  # if you don't need LAN scanning.
  scanner-agent:
    image: nautobot-scanner-agent:latest
    build:
      context: ../agent
    container_name: ${COMPOSE_PROJECT_NAME}-scanner-agent
    restart: unless-stopped
    # Host networking is the whole point — without it nmap can't see
    # ARP replies on the LAN and MAC discovery silently fails. Side
    # effect: the agent reaches Nautobot via the loopback port mapping
    # at 127.0.0.1:8087 (no docker DNS in host mode).
    network_mode: host
    user: "0"   # required for file-cap activation; cap_add bounds what's possible
    cap_add:
      - NET_RAW    # SYN scans, ICMP echo, ARP probes (nmap needs this for MAC)
      - NET_ADMIN  # interface enumeration (some nmap scan types)
    security_opt:
      - no-new-privileges:false
    environment:
      NAUTOBOT_URL: ${SCANNER_AGENT_NAUTOBOT_URL:-http://127.0.0.1:8087}
      AGENT_ID: ${SCANNER_AGENT_ID:-00000000-0000-0000-0000-000000000000}
      AGENT_TOKEN: ${SCANNER_AGENT_TOKEN:-placeholder}
      VERIFY_TLS: "false"
      POLL_INTERVAL_SECONDS: "10"     # fast polling for dev demo
      CHECKIN_INTERVAL_SECONDS: "30"
      SCAN_TIMEOUT_SECONDS: "3600"
      AGENT_VERSION: reference-agent/dev-host-mode
      AGENT_LOG_LEVEL: INFO
    depends_on:
      nautobot-web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  nautobot-static:
  nautobot-media:
  nautobot-git-repos:

networks:
  # Private per-stack network for DB/cache/internal-only traffic.
  internal:
    driver: bridge
  # Shared edge network for caddy-docker-proxy to discover nautobot-web.
  # Backend services (postgres, redis) intentionally NOT on this network
  # so they don't pollute the shared DNS namespace across stacks.
  caddy:
    external: true
