{# Shared CSS for the three template-content panels. Inlined per-render is fine — Nautobot strips duplicates server-side. #}
<style>

    font-size: 0.92em;
  }
  .scanner-inject .scanner-inject-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.6rem;
  }
  .scanner-inject .scanner-inject-stat {
    flex: 1 1 0;
    min-width: 80px;
    padding: 0.4rem 0.6rem;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    text-align: center;
  }
  .scanner-inject .scanner-inject-stat .num {
    display: block;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
  }
  .scanner-inject .scanner-inject-stat .num.muted { color: rgba(255,255,255,0.4); }

  .scanner-inject .scanner-inject-stat .num.crit  { color: #ff5c5c; }

    margin-top: 0.15rem;

    font-size: 0.85em;
    text-align: left;
  }
  .scanner-inject table.scanner-mini th {
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 0.05em;

    text-transform: uppercase;
    letter-spacing: 0.03em;
